events {
    # Define quantas conexões simultâneas cada processo do Nginx pode aguentar.
    worker_connections 1024;
}

http {
    # || CACHE ||
    # Cria a área no disco virtual do Docker onde os pedaços .m4s ficarão salvos.
    # keys_zone: Nome do cache e quantidade de memória RAM para os metadados (10m).
    # max_size: Tamanho máximo do HD dedicado ao cache (1g = 1 Gigabyte).
    # inactive: Se ninguém pedir o vídeo em 60 minutos, ele é apagado para liberar espaço.
    proxy_cache_path /tmp/nginx_cache levels=1:2 keys_zone=meu_cache_cdn:10m max_size=1g inactive=60m use_temp_path=off;

    # || LOAD BALANCER ||
    # Aponta para os dois servidores em Go que criados com o Docker Compose.
    upstream backend_videos {
        # O Nginx usa a rede interna do Docker (DNS) para achar essas máquinas.
        # Por padrão, ele usa a estratégia Round-Robin (1 pedido para cada), entretanto ele verifica todos os backs
        # caso ocorra um erro 404;
        server backend-go-1:8080;
        server backend-go-2:8080;
        server backend-aggregator:8080;
    }

    # || SERVER ||
    server {
        # Porta que o vue enxerga.
        listen 8080;
        server_name localhost;

        # || ROTAS ||
        location /videos/ {
            
            # Repassa o pedido para o Load Balancer
            proxy_pass http://backend_videos;

            # Se der 404, passara para o proximo backend
            proxy_next_upstream error timeout http_404;

            # Repassa a identidade de quem está pedindo para o Go
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            # Ativação do Cache
            proxy_cache meu_cache_cdn;
            # Guarda cópias apenas se o servidor Go disser que deu OK (200) ou Conteúdo Parcial (206)
            proxy_cache_valid 200 206 10m;
            
            # Retorna para o navegador se o arquivo veio do Cache (HIT) ou do Go (MISS)
            add_header X-CDN-Cache-Status $upstream_cache_status;

            # Resolução do CORS (Crucial para o MSE / player DASH funcionar)
            # Como o Vue está na porta 3000, o navegador bloqueia conexões para a 8080 por segurança.
            # Estas linhas dizem ao navegador do usuário: "Pode confiar, eu autorizo".
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
            # Libera os cabeçalhos que o protocolo DASH usa para ler os pedaços do vídeo
            add_header 'Access-Control-Expose-Headers' 'Content-Length, Content-Range, X-CDN-Cache-Status' always;
            
            # Responde automaticamente aos pedidos de "pré-checagem" do navegador
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*';
                add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS';
                add_header 'Access-Control-Allow-Headers' 'Origin, Accept, Content-Type, Range';
                add_header 'Access-Control-Max-Age' 1728000;
                add_header 'Content-Type' 'text/plain; charset=utf-8';
                add_header 'Content-Length' 0;
                return 204;
            }
        }

        location /manifesto/ {
            
            # Repassa o pedido para o Load Balancer
            proxy_pass http://backend_videos;

            # Se der 404, passara para o proximo backend
            proxy_next_upstream error timeout http_404;

            # Repassa a identidade de quem está pedindo para o Go
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            # Ativação do Cache
            proxy_cache meu_cache_cdn;
            # Guarda cópias apenas se o servidor Go disser que deu OK (200) ou Conteúdo Parcial (206)
            proxy_cache_valid 200 206 10m;
            
            # Retorna para o navegador se o arquivo veio do Cache (HIT) ou do Go (MISS)
            add_header X-CDN-Cache-Status $upstream_cache_status;

            # Resolução do CORS (Crucial para o MSE / player DASH funcionar)
            # Como o Vue está na porta 3000, o navegador bloqueia conexões para a 8080 por segurança.
            # Estas linhas dizem ao navegador do usuário: "Pode confiar, eu autorizo".
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
            # Libera os cabeçalhos que o protocolo DASH usa para ler os pedaços do vídeo
            add_header 'Access-Control-Expose-Headers' 'Content-Length, Content-Range, X-CDN-Cache-Status' always;
            
            # Responde automaticamente aos pedidos de "pré-checagem" do navegador
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*';
                add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS';
                add_header 'Access-Control-Allow-Headers' 'Origin, Accept, Content-Type, Range';
                add_header 'Access-Control-Max-Age' 1728000;
                add_header 'Content-Type' 'text/plain; charset=utf-8';
                add_header 'Content-Length' 0;
                return 204;
            }
        }

        location /catalogo {
            
            # Repassa o pedido para o Load Balancer
            proxy_pass http://backend-aggregator:8050;

            # Se der 404, passara para o proximo backend
            proxy_next_upstream error timeout http_404;

            # Repassa a identidade de quem está pedindo para o Go
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            # Ativação do Cache
            proxy_cache meu_cache_cdn;
            # Guarda cópias apenas se o servidor Go disser que deu OK (200) ou Conteúdo Parcial (206)
            proxy_cache_valid 200 206 10m;
            
            # Retorna para o navegador se o arquivo veio do Cache (HIT) ou do Go (MISS)
            add_header X-CDN-Cache-Status $upstream_cache_status;

            # Resolução do CORS (Crucial para o MSE / player DASH funcionar)
            # Como o Vue está na porta 3000, o navegador bloqueia conexões para a 8080 por segurança.
            # Estas linhas dizem ao navegador do usuário: "Pode confiar, eu autorizo".
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
            # Libera os cabeçalhos que o protocolo DASH usa para ler os pedaços do vídeo
            add_header 'Access-Control-Expose-Headers' 'Content-Length, Content-Range, X-CDN-Cache-Status' always;
            
            # Responde automaticamente aos pedidos de "pré-checagem" do navegador
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*';
                add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS';
                add_header 'Access-Control-Allow-Headers' 'Origin, Accept, Content-Type, Range';
                add_header 'Access-Control-Max-Age' 1728000;
                add_header 'Content-Type' 'text/plain; charset=utf-8';
                add_header 'Content-Length' 0;
                return 204;
            }
        }
    }
}